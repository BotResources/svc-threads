[workspace]
resolver = "3"
members = ["crates/contract-threads", "crates/svc-threads"]

# `version` is deliberately not inherited: each crate is its own release
# decision. `svc-threads` ships as an image tagged `svc-threads/v{version}`;
# `contract-threads` is released by its tag `contract-threads/v{version}`
# alone (consumers pull it as a git dependency). See `.github/workflows/cd.yml`.
[workspace.package]
edition = "2024"
# The floor of the two libraries the published language and the service are
# built on: br-service-engine v0.4.1 and br-llm-messages v0.3.0 both declare
# 1.89. CI builds on stable.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/BotResources/svc-threads"
publish = false

[workspace.dependencies]
contract-threads = { path = "crates/contract-threads", version = "0.1.0" }

# The conversation model Threads stores messages in (schema `br-llm-messages/2`).
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", package = "br-llm-messages", tag = "br-llm-messages/v0.3.0", version = "0.3.0" }

# The engine and the one `br-rust-common` tag it pins (engine README's table:
# v0.4.1 ↔ v1.3.0). Cargo keys a git source on its reference, so every
# `br-core-*` crate is pinned by the same tag as the engine's, or the
# Passport, the envelope and the coordinates would exist twice in the graph.
service-engine = { git = "https://github.com/BotResources/br-service-engine", package = "service-engine", tag = "v0.4.1", version = "0.4.1" }
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.3.0", version = "1.3.0" }
br-core-directory = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-directory", tag = "v1.3.0", version = "1.3.0" }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "v1.3.0", version = "1.3.0" }
br-core-scope = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-scope", tag = "v1.3.0", version = "1.3.0" }
br-scope-declaration-contract = { git = "https://github.com/BotResources/br-rust-common", package = "br-scope-declaration-contract", tag = "v1.3.0", version = "1.3.0" }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "v1.3.0", version = "1.3.0" }

# The e2e harness; its tag pins the same br-rust-common v1.3.0.
br-test-harness = { git = "https://github.com/BotResources/br-e2e-harness", package = "br-test-harness", tag = "v1.2.1", version = "1.2.1", default-features = false }
conformance-scope = { git = "https://github.com/BotResources/br-e2e-harness", package = "conformance-scope", tag = "v1.2.1", version = "1.2.1" }

async-graphql = { version = "=7.0.19", features = ["uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
