name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  probe:
    name: scaffold probe
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.probe.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pre-scaffold repository — Rust jobs are skipped until Cargo.toml lands."
          fi

  fmt:
    name: cargo fmt (auto-fix)
    needs: probe
    if: needs.probe.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all (+ the composed slices)
        run: |
          cargo fmt --all
          rustfmt --edition 2024 crates/svc-threads/src/slices/*/mod.rs

      - name: check + auto-fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "::error::Code is not formatted. Run 'cargo fmt --all' locally."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: cargo fmt (auto-fix)"
          git push
          echo "::error::Code was auto-formatted and pushed. Please re-run CI."
          exit 1

  check:
    name: cargo clippy + test
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: helm dependency build
        run: helm dependency build charts/br-svc-threads

      - name: helm lint chart
        run: helm lint charts/br-svc-threads --values charts/br-svc-threads/ci/lint-values.yaml

      - name: helm template dry-run
        run: helm template ci charts/br-svc-threads --values charts/br-svc-threads/ci/lint-values.yaml --debug > /dev/null

  integration:
    name: integration (e2e)
    needs: fmt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      MINIO_COMMIT: 01ce918d8279a20e4706b96a64396146894adee4
      NATSCLI_VERSION: v0.3.2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install nats-server
        run: |
          NATS_VERSION="v2.14.1"
          URL="https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -sSfL "$URL" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: cache the MinIO and natscli builds
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.threads-e2e-tools
          key: threads-e2e-tools-minio-${{ env.MINIO_COMMIT }}-natscli-${{ env.NATSCLI_VERSION }}

      - uses: actions/setup-go@v5
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          go-version: stable

      - name: build pinned MinIO and natscli (cache miss)
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/.threads-e2e-tools" go install "github.com/minio/minio@${MINIO_COMMIT}"
          GOBIN="$HOME/.threads-e2e-tools" go install "github.com/nats-io/natscli/nats@${NATSCLI_VERSION}"

      - name: put minio and nats on PATH
        run: |
          sudo install "$HOME/.threads-e2e-tools/minio" /usr/local/bin/minio
          sudo install "$HOME/.threads-e2e-tools/nats" /usr/local/bin/nats
          minio --version
          nats --version

      - name: Behavior scenarios (e2e)
        env:
          RUST_LOG: info
        run: cargo test -p svc-threads --tests --locked --no-fail-fast -- --include-ignored --test-threads=1

  audit:
    name: cargo audit (RustSec)
    needs: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny check
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  machete:
    name: cargo-machete (unused deps)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  changelog:
    name: changelog entry present (per crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: each touched crate must update its CHANGELOG
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Not a pull request — nothing to check."
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --quiet
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"

          fail=0
          if echo "$changed" | grep -qE '^(crates/svc-threads/|charts/|Cargo\.toml|Cargo\.lock|Dockerfile)' \
            && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::svc-threads changed without a CHANGELOG.md entry"
            fail=1
          fi
          if echo "$changed" | grep -vx 'crates/contract-threads/registry.toml' | grep -qE '^crates/contract-threads/' \
            && ! echo "$changed" | grep -qx 'crates/contract-threads/CHANGELOG.md'; then
            echo "::error::contract-threads changed without a crates/contract-threads/CHANGELOG.md entry"
            fail=1
          fi
          exit $fail

  registry-gate:
    name: registry gate (bumped versions sealed in the registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate bumped services against the Services registry
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          source scripts/tracked-services.sh

          read_version() {
              awk '
                  /^\[package\]/      { in_pkg = 1; next }
                  /^\[/ && !/^\[package\]/ { in_pkg = 0 }
                  in_pkg && /^version *=/ {
                      gsub(/[" ]/, "", $3); print $3; exit
                  }'
          }

          git fetch -q origin "${BASE_REF}"

          gated=0
          for svc in ${TRACKED_SERVICES}; do
              cargo="crates/${svc}/Cargo.toml"
              [[ -f "${cargo}" ]] || { echo "::error::missing ${cargo}"; exit 1; }

              version="$(read_version <"${cargo}")"
              base_version="$(git show "origin/${BASE_REF}:${cargo}" 2>/dev/null | read_version || true)"

              if [[ "${version}" == "${base_version}" ]]; then
                  continue
              fi
              if [[ "${version}" == *-dev* || "${version}" == *-rc* || "${version}" == *-pre* ]]; then
                  echo "${svc}: ${version} is non-release — not gated."
                  continue
              fi

              echo "${svc}: ${base_version:-<absent>} -> ${version} — gating against the registry."
              scripts/registry-gate.sh "${svc}" "${version}"
              gated=1
          done

          [[ "${gated}" -eq 1 ]] || echo "No tracked service version bump in this PR — nothing to gate."

      - name: Gate tracked libraries against the Libraries registry
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash scripts/library-pr-gate.sh

      - name: Library registry wiring tests
        run: bash scripts/test-library-registry.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh

  secrets:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
