name: CD

on:
  push:
    branches: [main]
    tags:
      - "svc-threads/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Service version to (re)publish (defaults to Cargo.toml)"
        required: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  detect-bump:
    name: detect-bump
    runs-on: ubuntu-latest
    outputs:
      publish_service: ${{ steps.detect.outputs.publish_service }}
      service_version: ${{ steps.detect.outputs.service_version }}
      tag_contract: ${{ steps.detect.outputs.tag_contract }}
      contract_version: ${{ steps.detect.outputs.contract_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect version bumps
        id: detect
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "Pre-scaffold repository — nothing to publish."
            {
              echo "publish_service=false"
              echo "service_version="
              echo "tag_contract=false"
              echo "contract_version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          crate_version() {
            grep -E '^version\s*=' "$1" | head -1 | sed 's/.*"\(.*\)".*/\1/'
          }
          is_release() {
            case "$1" in
              0.0.0|*-dev|*-rc*|*-pre*) return 1 ;;
              *) return 0 ;;
            esac
          }
          tag_exists() {
            git ls-remote --tags origin "refs/tags/$1" | grep -q .
          }

          # The workspace root is virtual — the service version lives on the
          # service crate's own manifest.
          service_version="$(crate_version crates/svc-threads/Cargo.toml)"
          publish_service=false
          case "${GITHUB_REF}" in
            refs/tags/svc-threads/v*)
              service_version="${GITHUB_REF#refs/tags/svc-threads/v}"
              publish_service=true
              echo "Tag trigger — republishing svc-threads ${service_version}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                input_version="${{ inputs.version }}"
                [ -n "$input_version" ] && service_version="$input_version"
                publish_service=true
                echo "Manual dispatch — publishing svc-threads ${service_version}"
              elif is_release "$service_version" \
                && ! tag_exists "svc-threads/v${service_version}" \
                && ! tag_exists "v${service_version}"; then
                if grep -qE "^## ${service_version}( |$)" CHANGELOG.md; then
                  publish_service=true
                else
                  echo "::warning::svc-threads ${service_version} has no CHANGELOG heading — not publishing"
                fi
              else
                echo "svc-threads ${service_version}: already released or not a release version"
              fi
              ;;
          esac

          # contract-threads — tag-only release, main pushes only. The crate has
          # no artifact: its release IS the tag (consumers pull it as a git
          # dependency), created when its version bumps with a matching plain
          # `## x.y.z` heading in its own CHANGELOG.
          contract_version="$(crate_version crates/contract-threads/Cargo.toml)"
          tag_contract=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && is_release "$contract_version" \
            && ! tag_exists "contract-threads/v${contract_version}"; then
            if grep -qE "^## ${contract_version}( |$)" crates/contract-threads/CHANGELOG.md; then
              tag_contract=true
            else
              echo "::warning::contract-threads ${contract_version} has no CHANGELOG heading — not tagging"
            fi
          else
            echo "contract-threads ${contract_version}: already tagged or not applicable"
          fi

          {
            echo "publish_service=${publish_service}"
            echo "service_version=${service_version}"
            echo "tag_contract=${tag_contract}"
            echo "contract_version=${contract_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Registry gate (pre-build)
        if: steps.detect.outputs.publish_service == 'true'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-gate.sh
          svc-threads
          "${{ steps.detect.outputs.service_version }}"
          ghcr.io/botresources/br-svc-threads

  registry-docs:
    name: Registry docs svc-threads
    needs: detect-bump
    if: needs.detect-bump.outputs.publish_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Registry gate (pre-publish re-check)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-gate.sh
          svc-threads
          "${{ needs.detect-bump.outputs.service_version }}"
          ghcr.io/botresources/br-svc-threads

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli (pinned to Cargo.lock's sqlx)
        run: >
          cargo install sqlx-cli
          --version 0.8.6
          --locked
          --no-default-features
          --features rustls,postgres

      - name: Build svc-threads (SDL source)
        run: cargo build --locked -p svc-threads

      - name: Registry docs (pose SDL + DB schema before the push)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-docs.sh
          svc-threads
          "${{ needs.detect-bump.outputs.service_version }}"
          --pg docker
          --binary target/debug/svc-threads

  publish:
    name: Publish image + chart
    needs: [detect-bump, registry-docs]
    if: needs.detect-bump.outputs.publish_service == 'true'
    runs-on: ubuntu-latest
    # GitHub-hosted (free for public repos — self-hosted ARC runners refuse
    # public repos by design), but inside the org runner image so the job
    # gets the same baked toolchain as arc-ubuntu, Zig included.
    container:
      image: ghcr.io/botresources/br-arc-runner:latest
      # root: the image's `runner` user is in docker gid 123, the hosted VM's
      # /var/run/docker.sock is gid 118 — as `runner`, every docker call is
      # "permission denied". The VM is discarded after the job, so running
      # the throwaway container as root costs nothing.
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The job runs as root inside br-arc-runner but the checkout is owned by
      # the host's runner user: without this every git command below dies with
      # "detected dubious ownership" (see svc-auth#44).
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # Zig (cargo-zigbuild's linker) comes from the job container image rather
      # than mlugg/setup-zig: that action's community-mirror download has no
      # timeout and once held a publish job for 2h. See
      # BotResources/infra.botresources.ai#241.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image + chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: ./scripts/publish.sh --skip-checks

  registry-implement:
    name: Registry implement svc-threads
    needs: [detect-bump, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.detect-bump.outputs.publish_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Record image + observe implemented flip
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-implement.sh
          svc-threads
          "${{ needs.detect-bump.outputs.service_version }}"
          ghcr.io/botresources/br-svc-threads:${{ needs.detect-bump.outputs.service_version }}

  tag-service:
    name: Tag + Release svc-threads
    needs: [detect-bump, publish]
    if: needs.detect-bump.outputs.publish_service == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.service_version }}
        run: |
          tag="svc-threads/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of CHANGELOG.md."

  tag-contract:
    name: Tag contract-threads
    needs: detect-bump
    if: needs.detect-bump.outputs.tag_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.contract_version }}
        run: |
          tag="contract-threads/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of crates/contract-threads/CHANGELOG.md."
