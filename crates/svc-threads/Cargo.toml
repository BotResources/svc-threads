[package]
name = "svc-threads"
version = "0.1.0"
description = "Threads — the shared conversation store: threads, members, messages in the br-llm-messages model, artifacts and read marks, served live to their members (fatty manner on br-service-engine)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `compose_service!` gates every slice on a cargo feature of the same name, so
# each composed capability needs one; nothing is meant to switch them off.
[features]
default = ["thread", "message", "artifact", "runner"]
thread = []
message = []
artifact = []
runner = []

[dependencies]
async-graphql.workspace = true
br-core-auth.workspace = true
br-core-directory.workspace = true
br-core-integration.workspace = true
chrono.workspace = true
contract-jobs.workspace = true
contract-threads.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
service-engine.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# ── e2e oracle suite only ───────────────────────────────────────────────────
# Everything below is TEST FIXTURE. The suite (tests/) is the executable
# specification of the service: it drives the real binary against real
# Postgres, real NATS JetStream + KV and a real MinIO, mocking nothing.
#
# No `service-engine` test-support: a dev dependency enabling an engine feature
# would be compiled into the very binary the suite spawns (cargo unifies
# features across a `cargo test` build) — a test seam inside the unit under
# test.
[dev-dependencies]
br-test-harness = { workspace = true, features = ["e2e-db", "graphql", "sse", "ws", "nats-fabric", "spawned-nats"] }
conformance-scope.workspace = true
br-core-auth = { workspace = true, features = ["test-support"] }
br-core-scope.workspace = true
br-scope-declaration-contract.workspace = true
br-util-nats-fabric.workspace = true
dotenvy = "0.15"
# The kubelet's half of readiness (`GET /readyz`) and the object store's POST:
# the harness GraphQL client answers JSON envelopes only.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusty-s3 = "0.10"
